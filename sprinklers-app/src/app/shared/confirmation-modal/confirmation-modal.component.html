@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
}
<mat-dialog-content>
  {{ data.content }}
</mat-dialog-content>
<mat-dialog-actions [align]="'end'">
  <button mat-stroked-button color="primary" mat-dialog-close>Nie</button>
  <button mat-raised-button [color]="data.confirmationColor" mat-dialog-close="true">
    Tak
  </button>
</mat-dialog-actions>
