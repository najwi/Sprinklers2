<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<title>Zraszacze 2.0</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="assets/sprinkler.svg" />
		<link rel="preconnect" href="https://fonts.gstatic.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/icon?family=Material+Icons"
			rel="stylesheet"
		/>
		<script>
			// Set a timeout to reload the page after 30 seconds if it's not fully loaded
			const reloadTimeout = setTimeout(() => {
				console.log("Reloading due to 30s load timeout");
				setTimeout(() => window.location.reload(), 1000);
			}, 30000);

			window.addEventListener("load", () => clearTimeout(reloadTimeout));
		</script>
		<style>
			#loader-box {
				position: fixed;
				width: 100%;
				height: 100%;
				background: white;
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 9999;
				transition: opacity 0.5s ease;
			}

			#loader-box.hidden {
				opacity: 0;
			}

			.loader {
				position: relative;
				width: 164px;
				height: 164px;
				perspective: 300px;
			}

			.loader::before {
				content: "";
				position: absolute;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				background-image: radial-gradient(
						circle 15px,
						#3f51b5 100%,
						transparent 0
					),
					radial-gradient(circle 15px, #3f51b5 100%, transparent 0),
					linear-gradient(#3f51b5 100px, transparent 0),
					linear-gradient(#3f51b5 100px, transparent 0);
				background-repeat: no-repeat;
				background-size: 30px 30px, 30px 30px, 40% 2px, 40% 2px;
				background-position: left center, right center, left center,
					right center;
				animation: rotateY 1s linear infinite;
			}

			.loader::after {
				content: "";
				position: absolute;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				background-image: radial-gradient(
						circle 15px,
						#ff4081 100%,
						transparent 0
					),
					radial-gradient(circle 15px, #ff4081 100%, transparent 0),
					linear-gradient(#ff4081 100px, transparent 0),
					linear-gradient(#ff4081 100px, transparent 0);
				background-repeat: no-repeat;
				background-size: 30px 30px, 30px 30px, 2px 40%, 2px 40%;
				background-position: top center, bottom center, top center,
					bottom center;
				animation: rotateX 1s linear infinite;
			}

			@keyframes rotateY {
				0% {
					transform: rotateY(0deg);
				}

				100% {
					transform: rotateY(-180deg);
				}
			}

			@keyframes rotateX {
				0%,
				25% {
					transform: rotateX(0deg);
				}

				75%,
				100% {
					transform: rotateX(-180deg);
				}
			}
		</style>
	</head>

	<body class="mat-typography">
		<div id="loader-box">
			<span class="loader"></span>
		</div>
		<app-root></app-root>
	</body>
</html>
